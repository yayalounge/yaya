<!DOCTYPE html>
<!-- YÄYA · commande à table : QR des tables à imprimer (lien gérant + « &app=qr »). Voir CommandeTable.gs. -->
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--noir:#050505;--blanc:#f2f1ee;--texte:#3a3936;--trait:#d9d8d3}
*{box-sizing:border-box}
body{margin:0;font:400 15px/1.5 system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:#f5f4f0;color:#1d1d1b}
.entete{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--trait);background:#fff}
.entete p{margin:0;max-width:52ch;color:var(--texte)}
.entete button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;background:#1d1d1b;color:#fff;cursor:pointer}
.planche{display:grid;grid-template-columns:repeat(auto-fill,minmax(15rem,1fr));gap:1rem;padding:16px}
.chevalet{background:var(--noir);color:var(--blanc);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.chevalet .logo{width:96px;height:auto}
.chevalet .num{font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.chevalet .num b{display:block;font-size:46px;letter-spacing:0;line-height:1;margin-top:4px;font-weight:500}
.chevalet .code{background:#fff;padding:12px;border-radius:10px;width:62%}
.chevalet .code svg{display:block;width:100%;height:auto}
.chevalet p{margin:0;font-size:13px;letter-spacing:.08em}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .entete{display:none}
  .planche{grid-template-columns:105mm 105mm;grid-auto-rows:148.5mm;gap:0;padding:0}
  .chevalet{border-radius:0;justify-content:center;break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact;border:.2mm dashed #888}
}
</style>
</head>
