# Projet Netlify du gérant : base « commande/ » du dépôt yayalounge/yaya, domaine commande.yaya-lounge.fr.
[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm test"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"

# /t/12?k=… → la page du client
[[redirects]]
  from = "/t/*"
  to = "/table.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://fidelite.kerrolabs.fr https://yaya-lounge.fr; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
