<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuisine">
<title>Cuisine · Yäya</title>
<link rel="manifest" href="/cuisine/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icone-180.png">
<link rel="preload" href="/assets/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/commun.css">
<link rel="stylesheet" href="/assets/cuisine.css">
<script type="module" src="/assets/cuisine.js"></script>
</head>
<body>
<section class="porte" id="porte" hidden>
  <img src="/assets/logo.svg" alt="Yäya Lounge" width="140" height="81">
  <p class="surtitre">Cuisine</p>
  <form id="form-code" autocomplete="off">
    <label class="sr-only" for="code">Code de la cuisine</label>
    <input id="code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Code" autocomplete="off" required>
    <button class="btn btn--plein btn--large" type="submit">Entrer</button>
    <p class="erreur-msg" id="erreur-code" role="alert"></p>
  </form>
</section>

<section class="demarrer" id="demarrer" hidden>
  <button class="btn btn--plein" id="btn-demarrer" type="button">Démarrer le service</button>
  <p>Active le son des nouvelles commandes et garde l’écran allumé.</p>
</section>

<div class="app" id="app" hidden>
  <header class="barre-haut">
    <div class="marque"><img src="/assets/logo.svg" alt="Yäya Lounge" width="62" height="36"><span class="surtitre">Cuisine</span></div>
    <div class="etat" id="etat"></div>
    <div class="outils">
      <span class="chiffres" id="chiffres"></span>
      <button class="btn btn--petit" id="btn-pause" type="button"></button>
      <button class="btn btn--petit btn--icone" id="btn-menu" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu">•••</button>
      <div class="menu" id="menu" hidden>
        <button type="button" id="btn-son">Tester le son</button>
        <a href="/cuisine/qr.html">QR codes des tables</a>
        <button type="button" id="btn-quitter">Quitter</button>
      </div>
    </div>
  </header>
  <div class="hors-ligne" id="hors-ligne" role="alert" hidden>Connexion perdue · nouvel essai…</div>
  <main class="colonnes">
    <section class="colonne colonne--nouvelles"><h2>À valider <span id="n-nouvelles"></span></h2><div id="col-nouvelles" class="pile"></div></section>
    <section class="colonne"><h2>En préparation <span id="n-validees"></span></h2><div id="col-validees" class="pile"></div></section>
    <section class="colonne"><h2>À encaisser <span id="n-servies"></span></h2><div id="col-servies" class="pile"></div></section>
  </main>
</div>
</body>
</html>
