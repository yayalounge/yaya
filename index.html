<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YÄYA Service</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Service">
<meta name="theme-color" content="#161513">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* App YÄYA pour l'iPad : affiche l'appli en plein écran. Le lien n'est pas écrit ici (page publique) :
   il est demandé une fois et gardé sur l'appareil. */
:root{--bg:#161513;--fg:#F2EFE7;--muted:#ABA598;--brass:#D9BB7C;--line:#39352D;--warn:#EE9A74}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg)}
#app iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.setup{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px max(24px,env(safe-area-inset-left));text-align:center}
.setup img{width:96px;height:96px;border-radius:22px;box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
.setup h1{font-weight:500;font-size:26px;margin:4px 0 0}
.setup p{color:var(--muted);font-size:15px;line-height:1.45;max-width:440px;margin:0}
.setup input{width:min(520px,100%);font:inherit;font-size:15px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#211F1B;color:var(--fg)}
.setup input:focus{outline:2px solid var(--brass);outline-offset:1px}
.setup button{font:inherit;font-weight:700;font-size:16px;padding:15px 28px;border-radius:14px;border:0;background:var(--brass);color:#1B1A17;width:min(520px,100%)}
.err{color:var(--warn);font-size:14px;min-height:20px}
.small{font-size:13px;color:var(--muted)}
#ov{position:fixed;inset:0;z-index:5;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ov iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
#ovx{position:fixed;z-index:6;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:#211F1B;color:var(--fg)}
.off{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:#2B2619;color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13px;display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="off" id="off">Pas de réseau · l’appli reprend dès qu’il revient</div>
<script>
var KEY = 'yaya-lien', app = document.getElementById('app');
function get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function set(v) { try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; } }
// Lien valide : celui de l'appli YÄYA (Google Apps Script), avec sa clé.
function valid(v) { return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\?.*\bk=[\w-]+/.test(v); }
function setup(msg) {
  app.innerHTML = '<div class="setup"><img src="icon-180.png" alt=""><h1>YÄYA Service</h1>' +
    '<p>Colle une seule fois le <b>lien service</b> de la tablette (celui que l’équipe ouvre d’habitude dans Safari). Il reste sur cette tablette.</p>' +
    '<input id="lien" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec?k=…">' +
    '<div class="err" id="err">' + (msg || '') + '</div><button id="ok">Ouvrir l’appli</button>' +
    '<p class="small">Pour changer de lien plus tard : ouvre cette page avec «&nbsp;?changer&nbsp;» à la fin de l’adresse.</p></div>';
  document.getElementById('ok').onclick = function () {
    var v = document.getElementById('lien').value.trim();
    if (!valid(v)) { document.getElementById('err').textContent = 'Ce n’est pas le lien de l’appli YÄYA. Copie-le depuis Safari, puis colle-le ici.'; return; }
    if (!set(v)) { document.getElementById('err').textContent = 'Impossible de garder le lien sur cet appareil (navigation privée ?).'; return; }
    open_(v);
  };
}
function open_(v) {
  app.innerHTML = '';
  var f = document.createElement('iframe');
  f.src = v;
  f.title = 'YÄYA';
  f.setAttribute('allow', 'geolocation; clipboard-write');
  f.setAttribute('referrerpolicy', 'no-referrer');
  app.appendChild(f);
}
if (/[?&]changer\b/.test(location.search)) { try { localStorage.removeItem(KEY); } catch (e) {} history.replaceState(null, '', location.pathname); }
var lien = get();
if (lien && valid(lien)) open_(lien); else setup();
function net() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'block'; }
// Position pour la prise de service : l'appli (dans la page Google) la demande ici, à l'app YÄYA,
// qui a sa propre autorisation de localisation. Seules les pages Google peuvent la demander.
// Analyses : ouvertes par-dessus l'appli, dans l'app (pas de bandeau Google, retour en un geste).
var ov = null, ovT = 0;
function fromOv(w) { if (!ov) return false; var f = ov.querySelector('iframe').contentWindow; for (var i = 0; w && i < 6; i++) { if (w === f) return true; if (w === window) return false; try { w = w.parent; } catch (x) { return false; } } return false; }
function closeOv() { clearTimeout(ovT); if (ov) { ov.remove(); ov = null; } var x = document.getElementById('ovx'); if (x) x.remove(); }
function openOv(u) {
  closeOv();
  ov = document.createElement('div'); ov.id = 'ov';
  var f = document.createElement('iframe'); f.src = u; f.title = 'YÄYA Analyses'; f.setAttribute('referrerpolicy', 'no-referrer');
  ov.appendChild(f); document.body.appendChild(ov);
  // Bouton de secours si la page des analyses ne se charge pas.
  ovT = setTimeout(function () { if (!ov || document.getElementById('ovx')) return; var b = document.createElement('button'); b.id = 'ovx'; b.textContent = 'Fermer'; b.onclick = closeOv; document.body.appendChild(b); }, 8000);
}
window.addEventListener('message', function (e) {
  var m = e.data || {};
  if (!e.source || !/^https:\/\/[\w.-]+\.(googleusercontent|google)\.com$/.test(e.origin)) return;
  if (m.yaya === 'hello?') { e.source.postMessage({ yaya: 'hello', id: m.id, shell: 1 }, e.origin); if (fromOv(e.source)) { clearTimeout(ovT); var x = document.getElementById('ovx'); if (x) x.remove(); } return; }
  if (m.yaya === 'open') { var u = String(m.url || ''); if (valid(u) && /[?&]app=analyses\b/.test(u)) openOv(u); return; }
  if (m.yaya === 'close') { if (fromOv(e.source)) closeOv(); return; }
  if (m.yaya !== 'pos?') return;
  var src = e.source, o = e.origin, id = m.id;
  src.postMessage({ yaya: 'pos', id: id, ack: true }, o);
  if (!navigator.geolocation) { src.postMessage({ yaya: 'pos', id: id, err: true, code: 2 }, o); return; }
  navigator.geolocation.getCurrentPosition(function (p) {
    src.postMessage({ yaya: 'pos', id: id, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }, o);
  }, function (er) {
    src.postMessage({ yaya: 'pos', id: id, err: true, code: er.code }, o);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
});
window.addEventListener('online', net); window.addEventListener('offline', net); net();
</script>
</body>
</html>
