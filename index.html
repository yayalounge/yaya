<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>YÄYA Service</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Service">
<meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100F0D" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* App YÄYA pour l'iPad : affiche l'appli en plein écran. Le lien n'est pas écrit ici (page publique) :
   il est demandé une fois et gardé sur l'appareil. */
:root{--bg:#161513;--app:#F4F2EC;--fg:#F2EFE7;--muted:#ABA598;--brass:#D9BB7C;--line:#39352D;--warn:#EE9A74}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;overflow:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:var(--bg)}
body.on,body.on #app,body.on #ov{background:var(--app)}
@media (prefers-color-scheme: dark){:root{--app:#100F0D}}
#app iframe,#ov iframe{display:block;width:100%;height:100%;border:0;background:transparent}
.setup{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px max(24px,env(safe-area-inset-left));text-align:center}
.setup img{width:96px;height:96px;border-radius:22px;box-shadow:0 18px 40px -20px rgba(0,0,0,.8)}
.setup h1{font-weight:500;font-size:26px;margin:4px 0 0}
.setup p{color:var(--muted);font-size:15px;line-height:1.45;max-width:440px;margin:0}
.setup input{width:min(520px,100%);font:inherit;font-size:16px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#211F1B;color:var(--fg)}
.setup input:focus{outline:2px solid var(--brass);outline-offset:1px}
.setup button{font:inherit;font-weight:700;font-size:16px;padding:15px 28px;border-radius:14px;border:0;background:var(--brass);color:#1B1A17;width:min(520px,100%)}
.err{color:var(--warn);font-size:14px;min-height:20px}
.small{font-size:13px;color:var(--muted)}
#ov{position:fixed;inset:0;z-index:5;overflow:hidden;background:var(--bg);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#ovx{position:fixed;z-index:6;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:99px;border:1px solid var(--line);background:#211F1B;color:var(--fg)}
.off{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:#2B2619;color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font-size:13px;display:none}
#ld{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--app);color:#1B1A17;transition:opacity .25s}
#ld.out{opacity:0;pointer-events:none}
#ld b{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
#ld span{font-size:15px;color:#7C7970}
#ld .bar{width:min(260px,64%);height:4px;border-radius:4px;background:rgba(0,0,0,.1);overflow:hidden}
#ld .bar i{display:block;height:100%;width:0;background:#9C7B3F;transition:width .2s linear}
@media (prefers-color-scheme: dark){#ld{color:#F2EFE7}#ld span{color:#ABA598}#ld .bar{background:rgba(255,255,255,.12)}#ld .bar i{background:#D9BB7C}}
@media (prefers-reduced-motion:reduce){#ld,#ld .bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="off" id="off">Pas de réseau · l’appli reprend dès qu’il revient</div>
<script>
// v32 · appli figée : pas de zoom (pincement, double-tap) sur iPhone et iPad.
(function () { var no = function (e) { e.preventDefault(); };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, no, { passive: false }); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1 || (e.scale && e.scale !== 1)) e.preventDefault(); }, { passive: false });
})();
// v33 · Chargement de l'appli affiché en pourcentage (à la place de l'écran vide). Google ne donne pas
// l'avancement réel : le pourcentage suit la durée habituelle d'ouverture sur cet appareil et n'atteint 100 %
// que lorsque l'appli YÄYA a vraiment démarré dans la page.
var LD = null;
function ldStart(frame) {
  ldDone(true);
  var el = document.createElement('div'); el.id = 'ld';
  el.innerHTML = '<b>0 %</b><div class="bar"><i></i></div><span>Chargement de YÄYA…</span>';
  document.body.appendChild(el);
  var K = 'yaya-ld-app', avg = 5000; try { avg = +localStorage.getItem(K) || 5000; } catch (e) {}
  var t0 = Date.now();
  LD = { el: el, frame: frame, t0: t0, avg: avg, K: K, tick: setInterval(function () {
    var p = Math.min(97, Math.round(100 * (1 - Math.exp(-(Date.now() - t0) / (avg / 2)))));
    el.querySelector('b').textContent = p + ' %'; el.querySelector('i').style.width = p + '%';
    if (Date.now() - t0 > 30000) ldDone(true);
  }, 150) };
}
function ldDone(skip) {
  if (!LD) return; var L = LD; LD = null; clearInterval(L.tick);
  if (!skip) { var d = Date.now() - L.t0; if (d > 80 && d < 60000) { try { localStorage.setItem(L.K, String(Math.round(L.avg * 0.6 + d * 0.4))); } catch (e) {} } }
  L.el.querySelector('b').textContent = '100 %'; L.el.querySelector('i').style.width = '100%';
  setTimeout(function () { L.el.classList.add('out'); setTimeout(function () { L.el.remove(); }, 300); }, skip ? 0 : 160);
}
var KEY = 'yaya-lien', app = document.getElementById('app');
function get() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
function set(v) { try { localStorage.setItem(KEY, v); return true; } catch (e) { return false; } }
// Lien valide : celui de l'appli YÄYA (Google Apps Script), avec sa clé.
function valid(v) { return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec\?.*\bk=[\w-]+/.test(v); }
function setup(msg) {
  app.innerHTML = '<div class="setup"><img src="icon-180.png" alt=""><h1>YÄYA Service</h1>' +
    '<p>Colle une seule fois le <b>lien service</b> de la tablette (celui que l’équipe ouvre d’habitude dans Safari). Il reste sur cette tablette.</p>' +
    '<input id="lien" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec?k=…">' +
    '<div class="err" id="err">' + (msg || '') + '</div><button id="ok">Ouvrir l’appli</button>' +
    '<p class="small">Pour changer de lien plus tard : ouvre cette page avec «&nbsp;?changer&nbsp;» à la fin de l’adresse.</p></div>';
  document.getElementById('ok').onclick = function () {
    var v = document.getElementById('lien').value.trim();
    if (!valid(v)) { document.getElementById('err').textContent = 'Ce n’est pas le lien de l’appli YÄYA. Copie-le depuis Safari, puis colle-le ici.'; return; }
    if (!set(v)) { document.getElementById('err').textContent = 'Impossible de garder le lien sur cet appareil (navigation privée ?).'; return; }
    open_(v);
  };
}
function open_(v) {
  document.body.classList.add('on');
  app.innerHTML = '';
  var f = document.createElement('iframe');
  f.src = v;
  f.title = 'YÄYA';
  f.setAttribute('allow', 'geolocation; clipboard-write');
  f.setAttribute('referrerpolicy', 'no-referrer');
  app.appendChild(f);
  ldStart(f);
}
if (/[?&]changer\b/.test(location.search)) { try { localStorage.removeItem(KEY); } catch (e) {} history.replaceState(null, '', location.pathname); }
var lien = get();
if (lien && valid(lien)) open_(lien); else setup();
function net() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'block'; }
// Position pour la prise de service : l'appli (dans la page Google) la demande ici, à l'app YÄYA,
// qui a sa propre autorisation de localisation. Seules les pages Google peuvent la demander.
// Analyses : ouvertes par-dessus l'appli, dans l'app (pas de bandeau Google, retour en un geste).
var ov = null, ovT = 0;
function fromOv(w) { if (!ov) return false; var f = ov.querySelector('iframe').contentWindow; for (var i = 0; w && i < 6; i++) { if (w === f) return true; if (w === window) return false; try { w = w.parent; } catch (x) { return false; } } return false; }
function closeOv() { if (LD && ov && LD.frame === ov.querySelector('iframe')) ldDone(true); clearTimeout(ovT); if (ov) { ov.remove(); ov = null; } var x = document.getElementById('ovx'); if (x) x.remove(); }
function openOv(u) {
  closeOv();
  ov = document.createElement('div'); ov.id = 'ov';
  var f = document.createElement('iframe'); f.src = u; f.title = 'YÄYA Analyses'; f.setAttribute('referrerpolicy', 'no-referrer');
  ov.appendChild(f); document.body.appendChild(ov); ldStart(f);
  // Bouton de secours si la page des analyses ne se charge pas.
  ovT = setTimeout(function () { if (!ov || document.getElementById('ovx')) return; var b = document.createElement('button'); b.id = 'ovx'; b.textContent = 'Fermer'; b.onclick = closeOv; document.body.appendChild(b); }, 8000);
}
function within(w, f) { for (var i = 0; w && i < 6; i++) { if (w === f) return true; if (w === window) return false; try { w = w.parent; } catch (x) { return false; } } return false; }
function fit(f, h) {
  if (!f || !(h > 0)) return;
  var box = f.parentNode, cs = getComputedStyle(box), base = box.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  var d = Math.round(f.getBoundingClientRect().height - h);
  if (d > 1 && d < 260) f.style.height = (base + d) + 'px'; else if (d <= 1 && d > -2) return; else f.style.height = '';
}
window.addEventListener('resize', function () { var fs = document.querySelectorAll('iframe'); for (var i = 0; i < fs.length; i++) fs[i].style.height = ''; });
window.addEventListener('message', function (e) {
  var m = e.data || {};
  if (!e.source || !/^https:\/\/[\w.-]+\.(googleusercontent|google)\.com$/.test(e.origin)) return;
  if (m.yaya === 'vp') {
    var mf = app.querySelector('iframe'), of = ov && ov.querySelector('iframe'), f = of && within(e.source, of.contentWindow) ? of : mf && within(e.source, mf.contentWindow) ? mf : null;
    if (f) fit(f, +m.h);
    if (f && LD && LD.frame === f) ldDone();
    if (f === mf && /^#[0-9a-f]{6}$/i.test(m.bg || '')) { document.documentElement.style.setProperty('--app', m.bg); var tc = document.querySelectorAll('meta[name=theme-color]'); for (var j = 0; j < tc.length; j++) tc[j].setAttribute('content', m.bg); }
    return;
  }
  if (m.yaya === 'hello?') { if (LD && within(e.source, LD.frame.contentWindow)) ldDone(); e.source.postMessage({ yaya: 'hello', id: m.id, shell: 1 }, e.origin); if (fromOv(e.source)) { clearTimeout(ovT); var x = document.getElementById('ovx'); if (x) x.remove(); } return; }
  if (m.yaya === 'open') { var u = String(m.url || ''); if (valid(u) && /[?&]app=analyses\b/.test(u)) openOv(u); return; }
  if (m.yaya === 'close') { if (fromOv(e.source)) closeOv(); return; }
  if (m.yaya !== 'pos?') return;
  var src = e.source, o = e.origin, id = m.id;
  src.postMessage({ yaya: 'pos', id: id, ack: true }, o);
  if (!navigator.geolocation) { src.postMessage({ yaya: 'pos', id: id, err: true, code: 2 }, o); return; }
  navigator.geolocation.getCurrentPosition(function (p) {
    src.postMessage({ yaya: 'pos', id: id, lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }, o);
  }, function (er) {
    src.postMessage({ yaya: 'pos', id: id, err: true, code: er.code }, o);
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
});
window.addEventListener('online', net); window.addEventListener('offline', net); net();
</script>
</body>
</html>
